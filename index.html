<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="UX/UI designer with experience in user research, interface design, accessibility, and front end implementation."
    />
    <meta name="theme-color" content="#161A1F" />
    <title>Damian Præsthus | UX/UI Designer</title>

    <!-- Fonts: loaded here (not via CSS @import) so the preload scanner
         finds them before the JS bundle executes. Weights are trimmed to
         what the type system actually renders — Plus Jakarta 400/500/600,
         Lora 400/500 (roman only), JetBrains Mono 400/500. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Lora:wght@400;500;600&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <link rel="canonical" href="https://damianpresthus.github.io/Portfolio/" />
    <!-- Monogram mark: a serif D with the accent dot, echoing the
         on-site "DAP•" brand lockup. Legible down to 16px. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23161A1F'/%3E%3Crect x='.75' y='.75' width='62.5' height='62.5' rx='14.25' fill='none' stroke='rgba(255,255,255,.07)' stroke-width='1.5'/%3E%3Ctext x='26' y='33' text-anchor='middle' dominant-baseline='central' font-family='Georgia, serif' font-size='44' font-weight='600' fill='%23F4F3F0'%3ED%3C/text%3E%3Ccircle cx='47' cy='42' r='5' fill='%23F98E1F'/%3E%3C/svg%3E"
    />
    <link
      rel="apple-touch-icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23161A1F'/%3E%3Crect x='.75' y='.75' width='62.5' height='62.5' rx='14.25' fill='none' stroke='rgba(255,255,255,.07)' stroke-width='1.5'/%3E%3Ctext x='26' y='33' text-anchor='middle' dominant-baseline='central' font-family='Georgia, serif' font-size='44' font-weight='600' fill='%23F4F3F0'%3ED%3C/text%3E%3Ccircle cx='47' cy='42' r='5' fill='%23F98E1F'/%3E%3C/svg%3E"
    />

    <meta property="og:title" content="Damian Præsthus | UX/UI Designer" />
    <meta
      property="og:description"
      content="UX/UI designer with experience in user research, interface design, accessibility, and front end implementation."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://damianpresthus.github.io/Portfolio/" />
    <!-- TODO: If deploying to a custom domain later, update canonical, og:url, and image URLs to the final hosted domain. -->
    <meta property="og:image" content="https://damianpresthus.github.io/Portfolio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Damian Præsthus | UX/UI Designer" />
    <meta
      name="twitter:description"
      content="UX/UI designer with experience in user research, interface design, accessibility, and front end implementation."
    />
    <meta name="twitter:image" content="https://damianpresthus.github.io/Portfolio/og-image.png" />

    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #161A1F;
      }

      html {
        background-color: #161A1F;
      }

      body {
        min-width: 320px;
        overscroll-behavior-y: auto;
      }

      /* ───────────────────────────────────────────────────────────
         Boot cover — a static, CSS-only title card painted on the
         very first frame, before the JS bundle and lazy Home chunk
         resolve. Without it the pre-content state (and any browser
         thumbnail capture) is a bare dark rectangle. It lives as a
         sibling of #root and dissolves the instant React mounts
         content into #root — no JS teardown required. Fully
         self-contained here because app CSS only arrives with the
         bundle. Fonts fall back to system serif/mono until the
         Google Fonts stylesheet resolves.
         ─────────────────────────────────────────────────────────── */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #161A1F;
        color: #fff;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        pointer-events: none;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        transition: opacity 0.45s ease 0.05s, visibility 0s linear 0.55s;
      }
      /* React has mounted → the app is underneath; fade the cover away. */
      #root:not(:empty) ~ #boot {
        opacity: 0;
        visibility: hidden;
      }
      #boot::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 38%;
        width: min(120vw, 900px);
        height: min(120vw, 900px);
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(249, 142, 31, 0.1),
          rgba(249, 142, 31, 0) 62%
        );
      }
      .boot__bar {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px clamp(24px, 5vw, 64px) 0;
        box-sizing: border-box;
      }
      .boot__mark {
        display: inline-flex;
        align-items: flex-end;
        gap: 3px;
        font-family: "Lora", Georgia, serif;
        font-weight: 600;
        font-size: 23px;
        line-height: 0.9;
        letter-spacing: 0.02em;
        color: rgba(255, 255, 255, 0.92);
      }
      .boot__dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #f98e1f;
        margin-bottom: 3px;
      }
      .boot__nav {
        display: flex;
        gap: 28px;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.42);
      }
      .boot__stage {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 24px 6vh;
      }
      .boot__name {
        margin: 0;
        font-family: "EB Garamond", "Lora", Georgia, serif;
        font-weight: 600;
        font-size: clamp(34px, 6.2vw, 58px);
        line-height: 1.05;
        letter-spacing: -0.015em;
        color: rgba(255, 255, 255, 0.94);
      }
      .boot__role {
        margin: 18px 0 0;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
      }
      .boot__load {
        position: relative;
        margin-top: 30px;
        width: 132px;
        height: 2px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
      }
      .boot__load::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 42%;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #f98e1f, transparent);
        animation: bootSweep 1.5s ease-in-out infinite;
      }
      @keyframes bootSweep {
        0% {
          transform: translateX(-130%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__load::after {
          animation: none;
          width: 100%;
          opacity: 0.55;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <!-- First-paint title card; auto-dissolves when React fills #root.
         See the #boot rules in <head> for the how and why. -->
    <div id="boot" aria-hidden="true">
      <header class="boot__bar">
        <span class="boot__mark">DAP<i class="boot__dot"></i></span>
        <nav class="boot__nav">
          <span>Work</span><span>About</span><span>Contact</span>
        </nav>
      </header>
      <div class="boot__stage">
        <p class="boot__name">Damian&nbsp;Præsthus</p>
        <p class="boot__role">UX / UI Designer · Front End</p>
        <span class="boot__load"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
